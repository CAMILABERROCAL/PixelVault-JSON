<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Mi selección de libros | AulaLibro</title>

  <link rel="icon" href="/img/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/estilos.css">

  <script src="/js/script.js" defer></script>
  <script src="/js/carrito-mejoras.js" defer></script>
</head>

<body data-page="cart">
  <header>
    <nav class="nav" aria-label="Navegación principal">
      <a class="brand" href="/index.html">
        AULA<span>LIBRO</span>
      </a>

      <div class="nav-links">
        <a href="/index.html#catalogo">Catálogo de libros</a>

        <a href="/carrito.html" aria-current="page">
          Mi selección <span class="count" id="cartCount">0</span>
        </a>

        <a href="/pedidos.html" id="ordersLink" hidden>
          Mis préstamos
        </a>

        <a href="/login.html?next=admin" id="adminLink">
          Biblioteca
        </a>

        <span class="user" id="userName"></span>

        <button id="logoutBtn" class="small ghost" hidden>
          Salir
        </button>
      </div>
    </nav>
  </header>

  <main class="wrap">
    <div class="eyebrow">Biblioteca escolar</div>

    <h1 class="page-title">Mi selección de libros</h1>

    <p class="muted">
      Revisa los libros que quieres solicitar en préstamo.
      Puedes quitar un libro o vaciar tu selección antes de continuar.
    </p>

    <div id="cartError" role="alert"></div>

    <div class="actions" style="margin-bottom:20px">
      <button
        type="button"
        id="clearCartBtn"
        class="ghost danger"
        aria-controls="cartView"
      >
        Vaciar selección
      </button>
    </div>

    <div id="cartView" aria-live="polite"></div>
  </main>

  <footer>
    AULALIBRO · Biblioteca escolar · Proyecto académico
  </footer>

  <div id="toast" role="status" hidden></div>
</body>
</html>
