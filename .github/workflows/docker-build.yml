name: Alexander - Docker Build

on:
  push:
    branches:
      - feature/alexander
  pull_request:
    branches:
      - dev
    paths:
      - Dockerfile
      - compose.yaml
      - .dockerignore
      - .github/workflows/docker-build.yml

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verificar construccion de Docker
        run: docker build -t pixelvault-json:test .