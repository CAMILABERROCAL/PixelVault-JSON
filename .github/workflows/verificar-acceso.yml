name: Verificar acceso y permisos

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-acceso-permisos:
    name: Comprobar Login, Registro y Permisos
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Ejecutar pruebas de acceso y seguridad
        run: mvn test -Dtest=*Security*,*Login*,*Acceso*
