services:
  pixelvault:
    build: .
    ports:
      - "8081:8081"
    environment:
      PIXELVAULT_DATA_DIR: /app/datos
      PIXELVAULT_ADMIN_EMAIL: ${PIXELVAULT_ADMIN_EMAIL:?Configura PIXELVAULT_ADMIN_EMAIL en el archivo .env}
      PIXELVAULT_ADMIN_PASSWORD: ${PIXELVAULT_ADMIN_PASSWORD:?Configura PIXELVAULT_ADMIN_PASSWORD en el archivo .env}
    volumes:
      - pixelvault_datos:/app/datos
    restart: unless-stopped

volumes:
  pixelvault_datos: