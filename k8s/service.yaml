# Manifiesto Service para exponer el puerto interno 8081 de PixelVault
apiVersion: v1
kind: Service
metadata:
  name: pixelvault-service
  labels:
    app: pixelvault
spec:
  type: ClusterIP
  selector:
    app: pixelvault
  ports:
    - name: http
      protocol: TCP
      port: 8081
      targetPort: http
